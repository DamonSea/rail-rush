<script>
window.onerror=function(m){document.getElementById('err').textContent='Error: '+m};
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,dpr,hz,gy,lw,unit,sky,vig,bld=[];
const F=10;
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 hz=H*.34;gy=H*.82;lw=Math.min(W*.36,H*.22);unit=lw*.8;
 sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#05010f');sky.addColorStop(.5,'#1b0b3d');sky.addColorStop(1,'#3a1458');vig=x.createRadialGradient(W/2,H*.55,H*.25,W/2,H*.55,H*.8);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.55)');
 bld=[];for(let i=0;i<300;i++)bld.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,p:Math.random()*6})
}
window.addEventListener('resize',resize);resize();
const proj=d=>F/(F+d),X=(l,s)=>W/2+l*lw*s,Y=s=>hz+(gy-hz)*s,ri=n=>Math.floor(Math.random()*n);
function sh(c,f){const n=parseInt(c.slice(1),16);const r=Math.min(255,(n>>16)*f)|0,g=Math.min(255,((n>>8)&255)*f)|0,b=Math.min(255,(n&255)*f)|0;return 'rgb('+r+','+g+','+b+')'}
function poly(p,c){x.fillStyle=c;x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fill()}

let state='title',objs=[],dist=0,coins=0,pl,spawnT=10,run=0,flash=0,overAt=0,best=0,sp=14;
try{best=+localStorage.getItem('railrush_best')||0}catch(e){}
function start(){
 initAudio();
 if(state==='over'&&performance.now()-overAt<1600)return;
 if(state==='play'||state==='pause'||state==='count')return;
 objs=[];dist=0;coins=0;spawnT=10;flash=0;sp=20;
 pl={lane:0,x:0,h:0,vy:0,slide:0};if(sv.pick&&sv.pw[sv.pick]>0){sv.pw[sv.pick]--;pl.pw=sv.pick;pl.pwT=30;if(sv.pw[sv.pick]<=0)sv.pick=null;save();build()}pl.danger=.1;pl.shT=0;ufo=newUfo();planetT=8+Math.random()*10;state='play';
}
function spawn(){
 const D=75,r=Math.random();
 if(pl&&(pl.jet>0||pl.fly)){skyRow(D);return}
 if(r<.3){const l=ri(3)-1;const arc=Math.random()<.5;for(let i=0;i<6;i++)objs.push({t:'coin',lane:l,d:D+i*2.4,len:0,ht:arc?.5+Math.sin(i/5*Math.PI)*2.6:.5})}
 else{
  const free=lastFree=Math.max(-1,Math.min(1,lastFree+ri(3)-1)),types=['low','high','train','train','mine'];
  for(let l=-1;l<=1;l++){
   if(l===free){const q=Math.random();if(q<.5)objs.push({t:'coin',lane:l,d:D+3,len:0});else if(q<.65)objs.push({t:q<.6?'low':'high',lane:l,d:D,len:.7});continue}
   if(Math.random()<.3)continue;
   const t=types[ri(5)];objs.push({t:t,lane:l,d:D,len:t==='train'?5+ri(4):.7});
  }
 }
}
function crash(force){
 if(!pl.alien&&!force){pl.danger=(pl.danger||0)+.35;pl.alien=1;pl.alienAt=coins;pl.pogo=0;pl.jet=0;sfx('hit');pl.inv=1.6;flash=1;rumble(.25,.7);try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}return}
 state='over';overAt=performance.now();flash=1;if(sv.noScare){scare=0;sfx('hit')}else{scare=1.3;sfx('scare')}rumble(.9,1);setMusicVol(1);
 const sc=score(),old=best;sv.coins+=coins;note='Banked '+sv.coins+' coins';if(sc>best){best=sc;try{localStorage.setItem('railrush_best',best)}catch(e){}if(old>0){sv.shop=true;sv.free++;note='NEW HIGH SCORE! +1 free crate'}}save();build();
 try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
}
const score=()=>Math.floor(dist/4)+coins*10;
function update(dt){
 if(state==='count'){cdT-=dt;if(cdT<=0)state='play'}
 if(state==='play'){if(pl.jb>0){pl.jb-=dt;if(pl.h<=.001&&pl.vy===0&&!pl.fly){pl.jb=0;move('u')}}
  sp=(20+Math.min(36,dist/70))*(pl.boost>0?2:1);
  dist+=sp*dt;run+=dt*sp*.5;
  pl.danger=Math.min(1.05,(pl.danger||0)+dt*(.04+(pl.alien?.05:0)));if(pl.danger>=1){crash(true);return}ufoUpdate(dt);
  pl.x+=(pl.lane-pl.x)*Math.min(1,dt*(pl.alien?6:14));
  if(pl.jet>0||pl.fly){if(pl.jet>0)pl.jet-=dt;pl.h+=(2.4-pl.h)*Math.min(1,dt*4);pl.vy=0;pl.jumps=0}else{let fl=0;for(const o of objs)if(o.t==='train'&&Math.abs(o.lane-pl.x)<.55&&o.d<.7&&o.d+o.len>-.4&&pl.h>=1.6)fl=1.7;if(pl.h>fl||pl.vy>0){pl.vy-=22*dt;pl.h+=pl.vy*dt;if(pl.h<=fl){pl.h=fl;pl.vy=0;pl.jumps=0}}}
  if(pl.slide>0)pl.slide-=dt;if(pl.pogo>0)pl.pogo-=dt;if(pl.inv>0)pl.inv-=dt;if(pl.back>0)pl.back-=dt;if(pl.pw){pl.pwT-=dt;if(pl.pwT<=0){pl.pw=null;pl.fly=false}}if(pl.shT>0)pl.shT-=dt;if(pl.shMsg>0)pl.shMsg-=dt;if(pl.bMsg>0)pl.bMsg-=dt;if(pl.boost>0){pl.boost-=dt;pl.danger=Math.max(0,(pl.danger||0)-dt*.04)}
  spawnT-=sp*dt;if(spawnT<=0){spawn();spawnT=17+sp*.2+Math.random()*7}planetT-=dt;if(planetT<=0){planetT=18+Math.random()*20;if(!(pl.jet>0||pl.fly)&&!(pl.boost>0))objs.push({t:'planet',lane:ri(3)-1,d:75,len:0,ht:1.1})}
  for(let i=objs.length-1;i>=0;i--){
   const o=objs[i];o.d-=sp*dt;
   if(o.d+o.len<-4){objs.splice(i,1);continue}
   if(Math.abs(o.lane-pl.x)>=(pl.alien?.65:.55))continue;
   if(o.t==='coin'){
    if(Math.abs(o.d)<.7&&(pl.jet>0||pl.fly||Math.abs(pl.h+.5-(o.ht||.5))<1.1)){coins++;sfx('coin');pl.danger=Math.max(0,(pl.danger||0)-.03);if(coins%150===0){pl.shT=30;pl.shMsg=2.2}if(!pl.alien&&!pl.pw&&coins%12===0)pl.pogo=12;if(!pl.alien&&!pl.pw&&coins%20===0){pl.jet=8;skyBurst()}if(pl.alien&&coins-pl.alienAt>=20){pl.alien=0;pl.back=1.8}objs.splice(i,1)}
   }else if(o.t==='planet'){if(Math.abs(o.d)<.9&&Math.abs(pl.h+.5-o.ht)<1.6){pl.boost=30;pl.bMsg=2.2;objs.splice(i,1);sfx('coin')}}else if(pl.inv>0||pl.pw==='ind'){}else if(o.d<.7&&o.d+o.len>-.4){
    if((o.t==='sky'&&pl.h>1.8)||(o.t==='train'&&pl.h<1.65)||(o.t==='low'&&pl.h<.55)||((o.t==='high'||o.t==='mine')&&pl.slide<=0&&pl.h<1.6)){crash();return}
   }
  }
 }else{
  run+=dt*(state==='title'?8:0);dist+=state==='title'?dt*14:0;
  for(const o of objs)o.d-=state==='title'?0:0;
 }
 if(flash>0)flash-=dt*2;if(scare>0)scare-=dt;
}
function box(L,d,len,h,cF,cS,cT){
 const s0=proj(d),s1=proj(d+len);
 const xl0=X(L-.45,s0),xr0=X(L+.45,s0),yb0=Y(s0),yt0=yb0-h*unit*s0;
 const xl1=X(L-.45,s1),xr1=X(L+.45,s1),yb1=Y(s1),yt1=yb1-h*unit*s1;
 poly([[xl0,yt0],[xr0,yt0],[xr1,yt1],[xl1,yt1]],cT);
 if(L<0)poly([[xr0,yt0],[xr0,yb0],[xr1,yb1],[xr1,yt1]],cS);
 if(L>0)poly([[xl0,yt0],[xl0,yb0],[xl1,yb1],[xl1,yt1]],cS);
 const gr0=x.createLinearGradient(0,yt0,0,yb0);gr0.addColorStop(0,sh(cF,1.25));gr0.addColorStop(1,sh(cF,.65));x.fillStyle=gr0;x.fillRect(xl0,yt0,xr0-xl0,yb0-yt0);
 return {xl:xl0,xr:xr0,yb:yb0,yt:yt0,s:s0};
}
function trainDetails(o,d,b){
 const L=o.lane,w=b.xr-b.xl,h=b.yb-b.yt,len=o.len;
 for(let k=1;k<=3;k++){const dd=d+len*k/4;if(dd<-2.4)continue;const s=proj(dd),cx=X(L,s),cy=Y(s)-1.7*unit*s;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(cx-.12*lw*s,cy-.02*lw*s,.24*lw*s,.05*lw*s)}
 if(L!==0){const ex=L<0?L+.45:L-.45;
  const quad=(da,db,h1,h2,col)=>{da=Math.max(da,-2.4);db=Math.max(db,-2.4);if(db<=da)return;const sa=proj(da),sb=proj(db);poly([[X(ex,sa),Y(sa)-h2*unit*sa],[X(ex,sb),Y(sb)-h2*unit*sb],[X(ex,sb),Y(sb)-h1*unit*sb],[X(ex,sa),Y(sa)-h1*unit*sa]],col)};
  quad(d,d+len,.28,.38,'#ffd23f');quad(d,d+len,0,.18,'#15151f');
  for(let a=d+.6;a<d+len-.5;a+=1.3)quad(a,a+.8,.85,1.4,'#8ffbff');
 }
 if(d<-2.2)return;
 x.fillStyle='#0f1530';x.fillRect(b.xl+w*.1,b.yt+h*.1,w*.8,h*.34);
 x.fillStyle='rgba(143,251,255,.35)';x.beginPath();x.moveTo(b.xl+w*.14,b.yt+h*.4);x.lineTo(b.xl+w*.4,b.yt+h*.12);x.lineTo(b.xl+w*.5,b.yt+h*.12);x.lineTo(b.xl+w*.24,b.yt+h*.4);x.fill();
 x.fillStyle='#252a4a';x.fillRect(b.xl+w*.48,b.yt+h*.1,w*.04,h*.34);
 x.fillStyle='#ffd23f';x.fillRect(b.xl,b.yt+h*.5,w,h*.07);
 x.shadowColor='#fff6a0';x.shadowBlur=12;x.fillStyle='#fffbd0';
 for(const fx of[.2,.8]){x.beginPath();x.arc(b.xl+w*fx,b.yt+h*.7,Math.max(1.5,w*.07),0,7);x.fill()}
 x.shadowBlur=0;
 x.fillStyle='#22222c';x.fillRect(b.xl,b.yb-h*.14,w,h*.14);
 x.fillStyle='#ffd23f';for(let k=0;k<6;k+=2)x.fillRect(b.xl+w*k/6,b.yb-h*.14,w/6,h*.14);
}
function shipDetails(o,d,b){
 const L=o.lane,w=b.xr-b.xl,h=b.yb-b.yt,len=o.len,cx=(b.xl+b.xr)/2;
 for(let k=1;k<=3;k++){const dd=d+len*k/4;if(dd<-2.4)continue;const s=proj(dd),px=X(L,s),py=Y(s)-1.7*unit*s;x.fillStyle='rgba(255,60,80,.7)';x.fillRect(px-.05*lw*s,py-.05*lw*s,.1*lw*s,.1*lw*s)}
 if(L!==0){const ex=L<0?L+.45:L-.45;
  for(let a=d+.7;a<d+len-.4;a+=1.4){if(a<-2.3)continue;const s=proj(a),px=X(ex,s),py=Y(s)-.95*unit*s;x.fillStyle='#8ffbff';x.beginPath();x.arc(px,py,.1*unit*s,0,7);x.fill();x.strokeStyle='#39424f';x.lineWidth=Math.max(1,s*2);x.stroke()}
 }
 if(d<-2.2)return;
 x.fillStyle='#0f1b3a';x.beginPath();x.ellipse(cx,b.yt+h*.3,w*.34,h*.17,0,0,7);x.fill();
 x.fillStyle='rgba(143,251,255,.45)';x.beginPath();x.ellipse(cx-w*.1,b.yt+h*.25,w*.12,h*.06,-.4,0,7);x.fill();
 x.fillStyle='#ff3d4d';x.fillRect(b.xl,b.yt+h*.52,w,h*.07);
 x.shadowColor='#7fdcff';x.shadowBlur=14;x.fillStyle='#bff3ff';
 for(const fx of[.22,.78]){x.beginPath();x.arc(b.xl+w*fx,b.yt+h*.74,Math.max(2,w*.09),0,7);x.fill()}
 x.shadowBlur=0;
 x.fillStyle='#262b38';x.fillRect(b.xl,b.yb-h*.12,w,h*.12);
 x.fillStyle='#ffd23f';for(let k=1;k<6;k+=2)x.fillRect(b.xl+w*k/6,b.yb-h*.12,w/6,h*.12);
}
function drawObj(o){
 if(o.d>78||o.d+o.len<-2.5)return;
 const d=Math.max(o.d,-2.5),s=proj(d);
 x.globalAlpha=Math.max(0,Math.min(1,(78-o.d)/18));
 if(o.t==='coin'){
  const cx=X(o.lane,s),cy=Y(s)-(o.ht||.5)*unit*s,r=.18*unit*s;
  x.shadowColor='#ffd23f';x.shadowBlur=12;{const gc=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);gc.addColorStop(0,'#fff3a0');gc.addColorStop(1,'#e0a000');x.fillStyle=gc}x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.fillStyle='#fff3a0';x.fillRect(cx-r*.2,cy-r*.5,r*.4,r);x.shadowBlur=0;
 }else if(o.t==='train'){
  const b=box(o.lane,d,o.len,1.7,'#8d99ae','#5c667a','#cfd8e8'),w=b.xr-b.xl,h=b.yb-b.yt;
  shipDetails(o,d,b);
 }else if(o.t==='planet'){
  const s=proj(d),cx=X(o.lane,s),cy=Y(s)-1.1*unit*s,r=.42*unit*s,t=performance.now()/400,hue=(t*40)%360;
  x.shadowColor='hsl('+hue+',100%,60%)';x.shadowBlur=24*s+8;
  const gp=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);gp.addColorStop(0,'hsl('+hue+',100%,75%)');gp.addColorStop(1,'hsl('+((hue+80)%360)+',100%,45%)');x.fillStyle=gp;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=Math.max(2,r*.12);x.beginPath();x.ellipse(cx,cy,r*1.6,r*.4,-.4,0,7);x.stroke();x.shadowBlur=0;
  x.fillStyle='#fff';x.font='bold '+Math.max(8,Math.round(r*.7))+'px sans-serif';x.textAlign='center';x.fillText('x2',cx,cy+r*.25);x.textAlign='left';
 }else if(o.t==='sky'){
  const s=proj(d),cx=X(o.lane,s),cy=Y(s)-2.4*unit*s,r=.42*unit*s,t=performance.now()/600;
  const gm=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);gm.addColorStop(0,'#b8a58f');gm.addColorStop(1,'#3d322a');x.fillStyle=gm;
  x.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5+t,rr=r*(k%2?.85:1.05);x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill();
  x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(cx+Math.cos(t)*r*.3,cy+Math.sin(t)*r*.2,r*.2,0,7);x.fill();
 }else if(o.t==='mine'){
  const s=proj(d),cx=X(o.lane,s),cy=Y(s)-1.2*unit*s,r=.3*unit*s;
  x.strokeStyle='#9aa5b8';x.lineWidth=Math.max(1.5,r*.18);
  for(let k=0;k<8;k++){const a=k*Math.PI/4;x.beginPath();x.moveTo(cx+Math.cos(a)*r*.8,cy+Math.sin(a)*r*.8);x.lineTo(cx+Math.cos(a)*r*1.35,cy+Math.sin(a)*r*1.35);x.stroke()}
  const gm=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);gm.addColorStop(0,'#6b7488');gm.addColorStop(1,'#262b38');x.fillStyle=gm;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.shadowColor='#ff3d4d';x.shadowBlur=14;x.fillStyle=Math.floor(performance.now()/300)%2?'#ff3d4d':'#7a1a24';x.beginPath();x.arc(cx,cy,r*.3,0,7);x.fill();x.shadowBlur=0;
 }else if(o.t==='low'){
  const s=proj(d),xl=X(o.lane-.45,s),xr=X(o.lane+.45,s),yb=Y(s),u=unit*s,w=xr-xl;
  poly([[xl+w*.05,yb],[xl+w*.2,yb-.45*u],[xl+w*.42,yb-.3*u],[xl+w*.58,yb-.58*u],[xl+w*.8,yb-.28*u],[xl+w*.95,yb]],'#8d99ae');
  poly([[xl+w*.2,yb-.45*u],[xl+w*.42,yb-.3*u],[xl+w*.3,yb-.05*u]],'#c9d3e6');
  poly([[xl+w*.58,yb-.58*u],[xl+w*.8,yb-.28*u],[xl+w*.62,yb-.1*u]],'#4f5a70');
  x.fillStyle='#ff3d4d';x.fillRect(xl+w*.3,yb-.2*u,w*.15,.06*u);
  x.shadowColor='#ff7a1a';x.shadowBlur=10;x.fillStyle='#ff9a1a';x.beginPath();x.arc(xl+w*.5,yb-.05*u,.08*u,0,7);x.fill();x.shadowBlur=0;
 }else{
  const xl=X(o.lane-.45,s),xr=X(o.lane+.45,s),yb=Y(s),u=unit*s;
  x.fillStyle='#7fffd4';x.fillRect(xl,yb-1.5*u,Math.max(3,.1*u),1.5*u);x.fillRect(xr-Math.max(3,.1*u),yb-1.5*u,Math.max(3,.1*u),1.5*u);
  x.fillStyle='#ff3d8b';x.fillRect(xl,yb-1.45*u,xr-xl,.4*u);
  x.fillStyle='#ffd0e6';const n=6,sw=(xr-xl)/n;for(let i=0;i<n;i+=2)x.fillRect(xl+i*sw,yb-1.45*u,sw,.4*u);
 }
 x.globalAlpha=1;
}
function drawScare(){
 const k=Math.min(1,(1.3-scare)*6+.3),sh=(Math.random()-.5)*14;
 x.save();x.translate(sh,sh*.6);
 x.fillStyle='#030a03';x.fillRect(-20,-20,W+40,H+40);
